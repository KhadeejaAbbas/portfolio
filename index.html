<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khadeeja Abbas | Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Quicksand:wght@300..700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Playwrite+NZ+Basic:wght@100..400&family=Quicksand:wght@300..700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/jpeg" href="./assets/imgs/apple.jpg">

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="loadingScreen">
        <div class="loader"></div>

        <h1>
            L<img src="./assets/imgs/apple.jpg" alt="apple">ading
        </h1>

        <div class="start-button-container">
            <button id="start-button">Start Journey</button>
        </div>
        
        <p id="loading-text">🐻 Waking up the bear...</p>
    </div>

    <div id="experience">
        <canvas id="experience-canvas"></canvas>
    </div>
     
    <div class="modal hidden">
        <div class="modal-wrapper">

            <div class="modal-header">
                <h1 class="modal-title">Project One</h1>
                <button class="modal-exit-button">&times;</button>
            </div>
            <div class="modal-content">
                <div class="modal-content-wrapper">

                    <a
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="modal-project-visit-button hidden"
                    > 
                        <span>🔗</span>
                        View Project
                    </a>

                    <div class="modal-project-description"></div>

                </div>
            </div>
        </div>
    </div>

    <div class="border-popup">
    You’ve reached the edge of the map!
    </div>
    <div class="name-popup">
    🐻 Careful! This bear is stronger than it appears. 🐻 
    </div>


    <!-- menu -->
    <div class="menu">
        <button
            id="menu-button"
            class="menu-button"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="menu-popup"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div
            id="menu-popup"
            class="menu-popup menu-hidden"
        >
            <h2>Menu</h2>

            <a href="./assets/resume.pdf" target="_blank">
                Resume
            </a>

            <a href="https://github.com/KhadeejaAbbas" target="_blank">
                GitHub
            </a>

            <a href="https://www.linkedin.com/in/khadeejaa/" target="_blank">
                LinkedIn
            </a>

            <button type="button" class="menu-reference-button">
                Behind the Scenes
            </button>
        </div>
    </div>
    <!-- inventory -->
<div class="inventory">
    <button
        id="backpack-button"
        class="backpack-button"
        type="button"
        aria-label="Open inventory"
    >
        🎒
    </button>

    <div id="inventory-popup" class="inventory-popup inventory-hidden">
        <div class="inventory-money">
            <span>🪙 Coins</span>
            <span id="coin-count">0</span>
        </div>
        <div class="inventory-item">
            <span>🧋 Drinks</span>
            <span id="drink-count">0</span>
        </div>
            <div class="inventory-item">
            <span>🍎 Apples</span>
            <span id="apple-count">0</span>
        </div>

        <div class="inventory-item">
            <span>🥭 Mangoes</span>
            <span id="mango-count">0</span>
        </div>

        <div class="inventory-item">
            <span>🍅 Tomatoes</span>
            <span id="tomato-count">0</span>
        </div>
    </div>
</div>

    <!-- inventory end -->

    <script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script type="module" src="./main.js"></script>

<!-- mobile controls -->
    <div class="mobile-controls" aria-label="Mobile movement controls">
    <button
        class="mobile-control mobile-up"
        data-key="w"
        aria-label="Move forward"
    >
        ▲
    </button>

    <button
        class="mobile-control mobile-left"
        data-key="a"
        aria-label="Move left"
    >
        ◀
    </button>

    <button
        class="mobile-control mobile-down"
        data-key="s"
        aria-label="Move backward"
    >
        ▼
    </button>

    <button
        class="mobile-control mobile-right"
        data-key="d"
        aria-label="Move right"
    >
        ▶
    </button>
</div>



</body>
</html>
